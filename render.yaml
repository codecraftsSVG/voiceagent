services:
  - type: web
    name: voice-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /_stcore/health
    envVars:
      - key: TOKENROUTER_API_KEY
        sync: false
      - key: TOKENROUTER_MODEL
        value: z-ai/glm-5.3-flash
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODE
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: ASR_PROVIDER
        value: groq
      - key: TTS_PROVIDER
        value: edge
      - key: TTS_VOICE
        value: en-US-GuyNeural
      - key: WHISPER_MODEL
        value: tiny
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: PORT
        value: 10000
